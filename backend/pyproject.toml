[project]
name = "protein-kanpai-api"
version = "0.1.0"
description = "プロテインで乾杯 のバックエンド API（Cloud Run / FastAPI）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "firebase-admin>=7.7.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "google-genai>=3.0.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["emulator: Firestore エミュレータが必要（FIRESTORE_EMULATOR_HOST があるときだけ実行）"]
filterwarnings = ["ignore:invalid escape sequence:SyntaxWarning"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
